name: Windows app

on:
  push:
    branches:
      - "codex/archive-failed-source-files-build"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PYTHONUTF8: "1"

jobs:
  windows-app:
    name: Build Amane Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Setup just
        uses: extractions/setup-just@v4

      # Always rebuild the UI: a cached or committed dist directory must never be packaged.
      - name: Rebuild web assets
        shell: pwsh
        run: |
          if (Test-Path web/dist) { Remove-Item web/dist -Recurse -Force }
          pnpm --dir web build

      - name: just windows-app
        run: just windows-app

      - name: Zip Amane
        id: zip
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $safeTag = $tag -replace '[^A-Za-z0-9._-]', '-'
          $zip = "dist/Amane-$safeTag-windows-x64.zip"
          if (-not (Test-Path dist/Amane/Amane.exe)) { throw "dist/Amane/Amane.exe missing" }
          if (-not (Test-Path dist/Amane/onedir/Amane.Server.exe)) { throw "onedir/Amane.Server.exe missing" }
          if (-not (Test-Path dist/Amane/web/dist/index.html)) { throw "web/dist/index.html missing" }
          Compress-Archive -Path dist/Amane -DestinationPath $zip
          "zip=$zip" | Add-Content $env:GITHUB_OUTPUT
          Get-Item $zip | Format-List FullName, Length
          Get-ChildItem dist/Amane -Recurse -Depth 2 | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Amane-windows-build
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: uv run python scripts/changelog.py extract "$GITHUB_REF_NAME" > release-notes.md

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: ${{ steps.zip.outputs.zip }}
          fail_on_unmatched_files: true
